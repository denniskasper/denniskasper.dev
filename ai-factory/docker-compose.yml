# Autonomous AI DevOps Factory
# Deployed via Dokploy on Hetzner VPS (2 CPU, 4 GB RAM)
#
# Workflow:
#   Telegram → OpenClaw → Redis (task queue) → Claude API → Sandbox → Dokploy
#
# Networks:
#   control-net  — internal data plane (OpenClaw, Redis, PostgreSQL)
#   socket-net   — Docker socket proxy (filtered access)
#   sandbox-net  — isolated ephemeral build containers
#
# Future services (enable with --profile):
#   qdrant  — vector knowledge base (--profile knowledge)

volumes:
  redis_data:
  postgres_data:
  openclaw_data:
  qdrant_data:

networks:
  control-net:
    driver: bridge
    internal: true

  socket-net:
    driver: bridge
    internal: true

  sandbox-net:
    driver: bridge
    internal: true

  # OpenClaw needs outbound internet (Claude API, Telegram)
  external-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Redis — task queue (Redis Streams) for agent jobs
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-factory-redis
    restart: unless-stopped
    command: >
      redis-server
        --save 60 1
        --save 300 100
        --appendonly yes
        --appendfsync everysec
        --maxmemory ${REDIS_MAXMEMORY:-50mb}
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD}
        --loglevel notice
    expose:
      - "6379"
    networks:
      - control-net
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 80M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    oom_score_adj: -200

  # ---------------------------------------------------------------------------
  # PostgreSQL — task state, memory, logs, project history
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: ai-factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aifactory}
      POSTGRES_USER: ${POSTGRES_USER:-aifactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: >
      postgres
        -c shared_buffers=64MB
        -c effective_cache_size=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=25
        -c wal_compression=on
        -c max_wal_size=256MB
        -c wal_keep_size=128MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c log_min_duration_statement=1000
    expose:
      - "5432"
    networks:
      - control-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifactory} -d ${POSTGRES_DB:-aifactory}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    oom_score_adj: -500

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — filtered Docker API access for OpenClaw
  # Prevents full root-equivalent access via raw socket mount.
  # ---------------------------------------------------------------------------
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ai-factory-dockerproxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Allow only what OpenClaw needs for sandbox management
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      NETWORKS: 1
      # Deny everything else
      VOLUMES: 0
      INFO: 0
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      BUILD: 0
    expose:
      - "2375"
    networks:
      - socket-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    oom_score_adj: -100

  # ---------------------------------------------------------------------------
  # OpenClaw — AI controller, Telegram bot, agent orchestrator
  #
  # Security:
  #   - Gateway bound to 127.0.0.1 only (CVE-2026-25253)
  #   - Uses Docker socket proxy instead of raw socket
  #   - API key never passed to sandbox containers
  # ---------------------------------------------------------------------------
  openclaw:
    image: ghcr.io/openclaw/openclaw:main-slim
    container_name: ai-factory-openclaw
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      dockerproxy:
        condition: service_healthy
    environment:
      # Node.js needs explicit heap size inside memory-limited containers
      NODE_OPTIONS: "--max-old-space-size=768"

      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Claude API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}

      # Redis — internal Docker DNS
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # PostgreSQL — internal Docker DNS
      DATABASE_URL: postgresql://${POSTGRES_USER:-aifactory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifactory}

      # Docker — use socket proxy, NOT raw socket
      DOCKER_HOST: tcp://dockerproxy:2375

      # OpenClaw gateway
      OPENCLAW_GATEWAY_HOST: "127.0.0.1"
      OPENCLAW_GATEWAY_PORT: "18789"

      # Sandbox limits (sequential execution on constrained VPS)
      OPENCLAW_SANDBOX_NETWORK: sandbox-net
      OPENCLAW_MAX_CONCURRENT_AGENTS: ${OPENCLAW_MAX_CONCURRENT_AGENTS:-1}
      OPENCLAW_AGENT_MEMORY_LIMIT: ${OPENCLAW_AGENT_MEMORY_LIMIT:-384m}
      OPENCLAW_AGENT_CPU_LIMIT: ${OPENCLAW_AGENT_CPU_LIMIT:-0.5}
    ports:
      - "127.0.0.1:18789:18789"
    networks:
      - control-net
      - socket-net
      - sandbox-net
      - external-net
    volumes:
      - openclaw_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18789/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    oom_score_adj: 0

  # ---------------------------------------------------------------------------
  # Qdrant — vector knowledge base (DEFERRED until VPS upgrade)
  # Enable with: docker compose --profile knowledge up -d
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-factory-qdrant
    restart: unless-stopped
    profiles:
      - knowledge
    expose:
      - "6333"
      - "6334"
    networks:
      - control-net
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
